
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KY Lake Levels</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#021326">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/ky-lake-192.png">

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
--bg:#020617;--card:#101827;--soft:#111827;--border:#1f2937;
--text:#e5edff;--muted:#9ca3af;--accent:#3b82f6;
--good:#4ade80;--bad:#f87171;
}
body{
margin:0;font-family:system-ui;
background:radial-gradient(circle at top,#0b1120,#020617);
color:var(--text);
}
body.day-mode{
--bg:#f1f5f9;--card:#fff;--soft:#f8fafc;--border:#cbd5f5;
--text:#020617;--muted:#4b5563;
background:#e2f3ff;
}
.app{max-width:1200px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:10px}
.soft{background:var(--soft)}
h1{margin:0;font-size:1.4rem}
h2{margin:0 0 6px;font-size:.95rem}
.sub{font-size:.8rem;color:var(--muted)}

.top-grid{
display:grid;gap:12px;
grid-template-areas:"s""w""m";
}
@media(min-width:980px){
.top-grid{
grid-template-columns:1fr 1fr;
grid-template-areas:"s w""m m";
}
}
.area-s{grid-area:s}
.area-w{grid-area:w}
.area-m{grid-area:m}

.btn{
padding:6px 12px;border-radius:999px;
border:1px solid var(--border);
background:var(--bg);color:var(--text);
font-size:.75rem;font-weight:700;cursor:pointer;
}
.btn.primary{background:var(--accent);border:none;color:#fff}

input,select{
border-radius:999px;padding:6px 10px;
background:var(--bg);color:var(--text);
border:1px solid var(--border);font-size:.75rem
}

table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:6px 8px;border-bottom:1px solid rgba(148,163,184,.2)}
th{font-size:.7rem;color:var(--muted)}
.num{text-align:right}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.fav{background:none;border:none;font-size:1rem;cursor:pointer;color:#64748b}
.fav.on{color:#fbbf24}
.row{cursor:pointer}
#map{height:340px;border-radius:14px;border:1px solid var(--border)}

.modal-bg{
position:fixed;inset:0;background:rgba(0,0,0,.7);
display:none;align-items:center;justify-content:center;z-index:9999
}
.modal{
background:var(--card);border-radius:18px;border:1px solid var(--border);
width:100%;max-width:640px;padding:14px
}
.footer{text-align:center;font-size:.75rem;opacity:.7;margin:30px 0}
</style>
</head>

<body>
<div class="app">

<div class="card">
<h1>KY Lake Levels</h1>
<div class="sub">Live lake levels, charts, maps & regs</div>
</div>

<div class="top-grid">

<!-- Sponsor -->
<div class="card soft area-s">
<div class="sub">Sponsored</div>
<strong>Sponsor spot available</strong>
<div class="sub">Reach KY boaters & anglers</div>
</div>

<!-- Weather -->
<div class="card soft area-w">
<h2 id="weatherTitle">Weather</h2>
<div id="weather">Loading…</div>

<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;gap:10px;flex-wrap:wrap">
<form onsubmit="event.preventDefault();loadWeather()">
ZIP <input id="zip" value="40351" maxlength="5">
<button class="btn primary">Go</button>
</form>

<div style="text-align:right">
<label><input type="checkbox" id="dayToggle"> Day mode</label>
<div class="sub">Off = Night mode</div>
</div>
</div>
</div>

<!-- Map -->
<div class="card soft area-m">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2>Map & GPS</h2>
<div>
<button class="btn primary" onclick="startGPS()">Use GPS</button>
<button class="btn" onclick="stopGPS()">Stop</button>
<button class="btn" onclick="centerKY()">Center KY</button>
</div>
</div>
<div id="map"></div>
<div class="sub" id="gpsStatus">GPS idle</div>
</div>

</div>

<!-- Lakes -->
<div class="card">
<table>
<thead>
<tr>
<th>★</th><th>Lake</th>
<th class="num">Pool</th>
<th class="num">Δ</th>
<th class="num">24h</th>
<th class="num">%Util</th>
</tr>
</thead>
<tbody id="lakes">
<tr><td colspan="6">Loading…</td></tr>
</tbody>
</table>

<!-- Chart -->
<div style="margin-top:14px;border-top:1px dashed rgba(148,163,184,.25);padding-top:10px">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
<strong>Lake Comparison</strong>
<select id="chartMetric">
<option value="percentUtil">% Utilization</option>
<option value="todayPool">Pool Elevation</option>
<option value="deviation">Deviation</option>
<option value="inflow">Inflow</option>
<option value="outflow">Outflow</option>
<option value="change24h">24h Δ</option>
</select>
</div>
<div style="height:360px;margin-top:10px">
<canvas id="lakeChart"></canvas>
</div>
</div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBG">
<div class="modal">
<button class="btn" onclick="closeModal()">Close</button>
<h3 id="modalTitle"></h3>
<div id="modalStats"></div>
<div style="margin-top:12px;text-align:right">
<a id="regsLink" class="btn primary" target="_blank">Open official regs</a>
</div>
</div>
</div>

<div class="footer">
Not affiliated with USACE or KDFWR
</div>

</div>

<script>
const API="https://ky-lake-backend.onrender.com";
let lastLakes=[];
let lakeChart=null;
let currentMetric="percentUtil";

/* Map */
let map=L.map("map").setView([37.8,-84.2],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
let gpsWatch=null,marker=null;
function centerKY(){map.setView([37.8,-84.2],7)}
function startGPS(){
if(!navigator.geolocation)return;
gpsWatch=navigator.geolocation.watchPosition(p=>{
let {latitude,longitude}=p.coords;
if(!marker)marker=L.circleMarker([latitude,longitude],{radius:7,color:"#22c55e"}).addTo(map);
marker.setLatLng([latitude,longitude]);
map.setView([latitude,longitude],13);
document.getElementById("gpsStatus").textContent="GPS active";
});
}
function stopGPS(){
if(gpsWatch)navigator.geolocation.clearWatch(gpsWatch);
document.getElementById("gpsStatus").textContent="GPS stopped";
}

/* Weather */
async function loadWeather(){
let zip=document.getElementById("zip").value;
let g=await fetch(`https://api.zippopotam.us/us/${zip}`).then(r=>r.json());
let p=g.places[0];
let w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&hourly=temperature_2m&temperature_unit=fahrenheit`).then(r=>r.json());
document.getElementById("weatherTitle").textContent=`Weather – ${p["place name"]}`;
document.getElementById("weather").textContent=`Now: ${w.hourly.temperature_2m[0]}°F`;
}
loadWeather();

/* Lakes */
async function loadLakes(){
let d=await fetch(`${API}/lakes`).then(r=>r.json());
lastLakes=d.lakes||[];
let tb=document.getElementById("lakes");
tb.innerHTML="";
lastLakes.forEach(l=>{
tb.innerHTML+=`
<tr class="row" onclick="openModal('${l.project}')">
<td><button class="fav">☆</button></td>
<td>${l.project}</td>
<td class="num">${l.todayPool?.toFixed(1)}</td>
<td class="num ${l.deviation>0?"pos":"neg"}">${l.deviation?.toFixed(1)}</td>
<td class="num">${l.change24h?.toFixed(1)}</td>
<td class="num">${l.percentUtil?.toFixed(2)}</td>
</tr>`;
});
renderChart();
}
loadLakes();

/* Chart */
function renderChart(){
const ctx=document.getElementById("lakeChart").getContext("2d");
if(lakeChart)lakeChart.destroy();
const usable=lastLakes.filter(l=>l[currentMetric]!=null);
lakeChart=new Chart(ctx,{
type:"bar",
data:{
labels:usable.map(l=>l.project),
datasets:[{label:currentMetric,data:usable.map(l=>l[currentMetric]),backgroundColor:"#3b82f6"}]
},
options:{indexAxis:"y",responsive:true,maintainAspectRatio:false}
});
}
document.getElementById("chartMetric").onchange=e=>{
currentMetric=e.target.value;
renderChart();
};

/* Modal */
function openModal(name){
document.getElementById("modalTitle").textContent=name;
document.getElementById("modalStats").innerHTML="";
document.getElementById("regsLink").href="https://fw.ky.gov/Fish/Pages/Species-Sizes-and-Limits.aspx";
document.getElementById("modalBG").style.display="flex";
}
function closeModal(){document.getElementById("modalBG").style.display="none"}

document.getElementById("dayToggle").onchange=e=>{
document.body.classList.toggle("day-mode",e.target.checked);
setTimeout(()=>map.invalidateSize(),150);
};
</script>
</body>
</html>
