<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KY Lake Levels</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#021326" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icons/ky-lake-192.png" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-main: #020715;
      --bg-card: #101827;
      --bg-card-soft: #111827;
      --border-subtle: #1f2937;
      --text-main: #e5edff;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --success: #4ade80;
      --danger: #f97373;
      --chip-bg: #111827;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b1120, #020617 55%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }

    body.boat-mode {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-soft: #f8fafc;
      --border-subtle: #cbd5f5;
      --text-main: #020617;
      --text-muted: #4b5563;
      --accent: #0284c7;
      --chip-bg: #e2f3ff;
      background: #e2f3ff;
    }

    .app-shell {
      width: 100%;
      max-width: 1200px;
      padding: 12px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      padding: 12px;
      margin-bottom: 10px;
    }

    .card-soft {
      background: var(--bg-card-soft);
    }

    h1 { margin: 0; font-size: 1.4rem; }
    h2 { margin: 0 0 6px; font-size: 0.95rem; }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Sponsor Card */
    .sponsor-logo {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      object-fit: cover;
      background: var(--bg-main);
    }

    .sponsor-btn {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .sponsor-btn.primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(148,163,184,0.15);
      white-space: nowrap;
    }

    th {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: left;
    }

    .num { text-align: right; }
    .delta-pos { color: var(--success); }
    .delta-neg { color: var(--danger); }

    .fav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: #64748b;
    }

    .fav-btn.favorited { color: #fbbf24; }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 0.75rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>
<div class="app-shell">

  <header class="card">
    <h1>KY Lake Levels</h1>
    <div class="subtitle">Live lake conditions for Kentucky boaters</div>
  </header>

  <!-- SPONSOR CARD -->
  <section class="card card-soft">
    <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:6px;">
      Sponsored
    </div>
    <div id="sponsor-content" style="display:flex;gap:12px;align-items:center;min-height:60px;">
      Loading sponsor…
    </div>
  </section>

  <!-- LAKE TABLE -->
  <section class="card">
    <table>
      <thead>
        <tr>
          <th>★</th>
          <th>Lake</th>
          <th class="num">Pool</th>
          <th class="num">Δ</th>
          <th class="num">24h</th>
          <th class="num">% Util</th>
        </tr>
      </thead>
      <tbody id="lakes-body">
        <tr><td colspan="6">Loading lakes…</td></tr>
      </tbody>
    </table>
  </section>

  <footer>
    Not affiliated with the U.S. Army Corps of Engineers.  
    Data provided as-is.
  </footer>

</div>

<script>
const BACKEND_URL = "https://ky-lake-backend.onrender.com";
const FAVORITES_KEY = "kyLakeFavorites";
let sponsorList = [];

function getFavorites() {
  try { return JSON.parse(localStorage.getItem(FAVORITES_KEY)) || []; }
  catch { return []; }
}

async function loadSponsors() {
  try {
    const r = await fetch(`${BACKEND_URL}/sponsors`);
    sponsorList = await r.json();
  } catch {
    sponsorList = [];
  }
}

function pickSponsor() {
  const active = sponsorList.filter(s => s.active !== false);
  const favs = getFavorites();
  for (const f of favs) {
    const match = active.find(s => (s.lakes || []).includes(f));
    if (match) return match;
  }
  return active[Math.floor(Math.random() * active.length)] || null;
}

function renderSponsor(s) {
  const el = document.getElementById("sponsor-content");
  if (!s) {
    el.innerHTML = `<strong>Sponsor spot available</strong>`;
    return;
  }

  el.innerHTML = `
    <img class="sponsor-logo" src="${s.logoUrl || ""}">
    <div>
      <strong>${s.name}</strong>
      <div class="subtitle">${s.cta || ""}</div>
      <div style="display:flex;gap:8px;margin-top:6px;">
        ${s.phone ? `<a class="sponsor-btn primary" href="tel:${s.phone}">Call</a>` : ""}
        ${s.directionsUrl ? `<a class="sponsor-btn" href="${s.directionsUrl}" target="_blank">Directions</a>` : ""}
        ${s.website ? `<a class="sponsor-btn" href="${s.website}" target="_blank">Website</a>` : ""}
      </div>
    </div>`;
}

async function loadLakes() {
  const body = document.getElementById("lakes-body");
  try {
    const r = await fetch(`${BACKEND_URL}/lakes`);
    const data = await r.json();
    body.innerHTML = "";
    data.lakes.forEach(l => {
      const favs = getFavorites();
      const isFav = favs.includes(l.project);
      body.innerHTML += `
        <tr>
          <td>
            <button class="fav-btn ${isFav ? "favorited" : ""}"
              onclick="toggleFav('${l.project}')">
              ${isFav ? "★" : "☆"}
            </button>
          </td>
          <td>${l.project}</td>
          <td class="num">${l.todayPool?.toFixed(1)}</td>
          <td class="num ${l.deviation>0?"delta-pos":"delta-neg"}">${l.deviation?.toFixed(1)}</td>
          <td class="num">${l.change24h?.toFixed(1)}</td>
          <td class="num">${l.percentUtil?.toFixed(2)}</td>
        </tr>`;
    });
  } catch {
    body.innerHTML = "<tr><td colspan='6'>Failed to load lakes</td></tr>";
  }
}

function toggleFav(p) {
  const favs = new Set(getFavorites());
  favs.has(p) ? favs.delete(p) : favs.add(p);
  localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favs]));
  renderSponsor(pickSponsor());
  loadLakes();
}

document.addEventListener("DOMContentLoaded", async () => {
  await loadSponsors();
  renderSponsor(pickSponsor());
  loadLakes();
});
</script>

</body>
</html>
