<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KY Lake Levels</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#021326">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/ky-lake-192.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
--bg:#020617;--card:#101827;--soft:#111827;--border:#1f2937;
--text:#e5edff;--muted:#9ca3af;--accent:#3b82f6;
--good:#4ade80;--bad:#f97373;
}
body{
margin:0;font-family:system-ui;
background:radial-gradient(circle at top,#0b1120,#020617);
color:var(--text);
}
body.boat{
--bg:#f1f5f9;--card:#fff;--soft:#f8fafc;--border:#cbd5f5;
--text:#020617;--muted:#4b5563;background:#e2f3ff;
}
.app{max-width:1200px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:10px}
.soft{background:var(--soft)}
h1{margin:0;font-size:1.4rem}
h2{margin:0 0 6px;font-size:.95rem}
.sub{font-size:.8rem;color:var(--muted)}
.grid{
display:grid;gap:10px;
grid-template-areas:"sponsor" "weather" "map";
}
@media(min-width:980px){
.grid{
grid-template-columns:1fr 1fr;
grid-template-areas:
"sponsor weather"
"map map";
}
}
.area-sponsor{grid-area:sponsor}
.area-weather{grid-area:weather}
.area-map{grid-area:map}
.pill{
border-radius:999px;padding:6px 12px;
border:1px solid var(--border);
background:var(--bg);color:var(--text);
font-size:.75rem;font-weight:800;cursor:pointer
}
.pill.primary{background:var(--accent);color:#fff;border:none}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:6px 8px;border-bottom:1px solid rgba(148,163,184,.2)}
th{font-size:.7rem;color:var(--muted)}
.num{text-align:right}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.fav{background:none;border:none;font-size:1rem;cursor:pointer;color:#64748b}
.fav.on{color:#fbbf24}
#map{height:340px;border-radius:14px;border:1px solid var(--border)}
.modal-bg{
position:fixed;inset:0;background:rgba(0,0,0,.7);
display:none;align-items:center;justify-content:center;z-index:999
}
.modal{
background:var(--card);border-radius:16px;
border:1px solid var(--border);padding:14px;max-width:520px;width:100%
}
.footer{text-align:center;font-size:.75rem;opacity:.7;margin:24px}
</style>
</head>

<body>
<div class="app">

<!-- HEADER -->
<div class="card">
<h1>KY Lake Levels</h1>
<div class="sub">Live levels, maps, sponsors, and KY fishing regs</div>
</div>

<!-- TOP GRID -->
<div class="grid">

<!-- SPONSOR -->
<div class="card soft area-sponsor">
<div class="sub">Sponsored</div>
<strong>Sponsor spot available</strong>
<div class="sub">Reach local anglers and boaters</div>
</div>

<!-- WEATHER -->
<div class="card soft area-weather">
<h2 id="wTitle">Weather</h2>
<div id="wMain">Loading…</div>
<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
<input id="zip" value="40351" style="width:90px;border-radius:999px;padding:4px">
<button class="pill primary" onclick="loadWeather()">Go</button>
<label class="sub"><input type="checkbox" id="boatToggle"> Boat mode</label>
</div>
</div>

<!-- MAP -->
<div class="card soft area-map">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2>Map & GPS</h2>
<div>
<button class="pill primary" onclick="gps()">Use GPS</button>
<button class="pill" onclick="centerKY()">Center KY</button>
</div>
</div>
<div id="map"></div>
</div>

</div>

<!-- LAKES -->
<div class="card">
<table>
<thead>
<tr>
<th>★</th><th>Basin</th><th>Lake</th>
<th class="num">Pool</th>
<th class="num">Δ</th>
<th class="num">24h</th>
<th class="num">%Util</th>
</tr>
</thead>
<tbody id="lakes"><tr><td colspan="7">Loading…</td></tr></tbody>
</table>
</div>

<!-- CHART -->
<div class="card"><canvas id="chart" height="300"></canvas></div>

<div class="footer">
Not affiliated with USACE or KDFWR. Always verify regulations.
</div>

</div>

<!-- LAKE MODAL -->
<div class="modal-bg" id="modalBg">
<div class="modal">
<div style="display:flex;justify-content:space-between">
<div>
<strong id="mTitle"></strong>
<div class="sub" id="mSub"></div>
</div>
<button class="pill" onclick="closeModal()">Close</button>
</div>

<div id="mStats" style="margin-top:10px"></div>

<div style="display:flex;justify-content:flex-end;margin-top:12px">
<a id="regsLink" class="pill primary" target="_blank">Open official regs</a>
</div>
</div>
</div>

<script>
const API="https://ky-lake-backend.onrender.com";
let map=L.map("map").setView([37.8,-84.2],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
let marker=null;

function centerKY(){map.setView([37.8,-84.2],7)}
function gps(){
navigator.geolocation.getCurrentPosition(p=>{
let {latitude,longitude}=p.coords;
if(!marker)marker=L.circleMarker([latitude,longitude]).addTo(map);
marker.setLatLng([latitude,longitude]);
map.setView([latitude,longitude],13);
});
}

async function loadWeather(){
let zip=document.getElementById("zip").value;
let g=await fetch(`https://api.zippopotam.us/us/${zip}`).then(r=>r.json());
let p=g.places[0];
let w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&hourly=temperature_2m&temperature_unit=fahrenheit`).then(r=>r.json());
document.getElementById("wTitle").textContent=`Weather – ${p["place name"]}`;
document.getElementById("wMain").textContent=`Now: ${w.hourly.temperature_2m[0]}°F`;
}
loadWeather();

async function loadLakes(){
let d=await fetch(`${API}/lakes`).then(r=>r.json());
let tb=document.getElementById("lakes");
tb.innerHTML="";
d.lakes.forEach(l=>{
let tr=document.createElement("tr");
tr.innerHTML=`
<td><button class="fav">☆</button></td>
<td>${l.basin||""}</td>
<td>${l.project}</td>
<td class="num">${l.todayPool?.toFixed(1)}</td>
<td class="num ${l.deviation>0?"pos":"neg"}">${l.deviation?.toFixed(1)}</td>
<td class="num">${l.change24h?.toFixed(1)}</td>
<td class="num">${l.percentUtil?.toFixed(2)}</td>`;
tr.onclick=()=>openModal(l);
tb.appendChild(tr);
});
drawChart(d.lakes);
}
loadLakes();

function drawChart(l){
new Chart(document.getElementById("chart"),{
type:"bar",
data:{labels:l.map(x=>x.project),datasets:[{label:"% Util",data:l.map(x=>x.percentUtil)}]},
options:{indexAxis:"y"}
});
}

function openModal(l){
document.getElementById("mTitle").textContent=l.project;
document.getElementById("mSub").textContent=l.basin||"";
document.getElementById("mStats").innerHTML=`
<div>Pool: ${l.todayPool?.toFixed(1)} ft</div>
<div>Deviation: ${l.deviation?.toFixed(1)} ft</div>
<div>24h Δ: ${l.change24h?.toFixed(1)} ft</div>
<div>Flood Util: ${l.percentUtil?.toFixed(2)}%</div>`;
document.getElementById("regsLink").href=
`https://fw.ky.gov/Fish/Pages/Species-Sizes-and-Limits.aspx`;
document.getElementById("modalBg").style.display="flex";
}
function closeModal(){document.getElementById("modalBg").style.display="none"}

document.getElementById("boatToggle").onchange=e=>{
document.body.classList.toggle("boat",e.target.checked);
};
</script>
</body>
</html>
